        {statsLoading&&<div className="spinner"/>}
        {stats&&<>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:16}}>
            {[['Total stubs',stats.total_stubs],['Mealie-linked',stats.mealie_linked],['Rejections',stats.total_rejections]].map(([l,v])=>(
              <div key={l} style={{textAlign:'center',padding:'12px 8px',background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:8}}>
                <div style={{fontSize:28,fontWeight:700,color:'var(--primary)'}}>{v}</div>
                <div style={{fontSize:12,color:'var(--gray)'}}>{l}</div>
              </div>
            ))}
          </div>
          <h4 style={{fontSize:13,fontWeight:600,marginBottom:8}}>By source</h4>
          {Object.entries(stats.stubs_by_source).length===0
            ?<p style={{fontSize:13,color:'var(--gray)'}}>No recipe stubs yet — trigger a scrape from the Sources page.</p>
            :<table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
              <thead><tr style={{borderBottom:'2px solid var(--border)'}}>
                <th style={{textAlign:'left',padding:'6px 0',color:'var(--gray)',fontWeight:500}}>Source</th>
                <th style={{textAlign:'right',padding:'6px 0',color:'var(--gray)',fontWeight:500}}>Stubs</th>
                <th style={{textAlign:'right',padding:'6px 0',color:'var(--gray)',fontWeight:500}}>Share</th>
              </tr></thead>
              <tbody>
                {Object.entries(stats.stubs_by_source).map(([src,cnt])=>(
                  <tr key={src} style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:'7px 0'}}>{src}</td>
                    <td style={{textAlign:'right',fontWeight:600,padding:'7px 0'}}>{cnt}</td>
                    <td style={{textAlign:'right',color:'var(--gray)',padding:'7px 0'}}>
                      {stats.total_stubs>0?Math.round(cnt/stats.total_stubs*100)+'%':'—'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          }
          <button className="btn-secondary btn-sm" style={{marginTop:12}} onClick={loadStats}>↺ Refresh</button>
        </>}
      </div>

      <div className="card" style={{borderLeft:'4px solid var(--amber, #f59e0b)'}}>
        <h3 className="section-title">🧹 Wipe Recipe Cache</h3>
        <p style={{fontSize:14,marginBottom:8}}>Deletes all scraped recipe stubs and rejection history from the local database.</p>
        <div style={{fontSize:13,color:'var(--gray)',marginBottom:16}}>
          <div style={{marginBottom:4}}><strong>Deleted:</strong> All unconfirmed recipe stubs · All rejection records</div>
          <div><strong>Kept:</strong> Recipes already imported to Mealie · Household preferences · Pantry items · Meal plan history</div>
        </div>
        <p style={{fontSize:13,color:'var(--gray)',marginBottom:16}}>Use this to start fresh after testing, or to force a full re-scrape from HelloFresh and Home Chef. The nightly scraper (or ⚡ Scrape on the Sources page) will rebuild the cache.</p>

        {!showConfirm&&<button className="btn-danger" onClick={()=>setShowConfirm(true)} disabled={wiping}>
          🗑️ Wipe Recipe Cache
        </button>}

        {showConfirm&&<div style={{background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:8,padding:16,marginTop:8}}>
          <p style={{fontWeight:600,marginBottom:8}}>⚠️ Are you sure?</p>
          <p style={{fontSize:13,color:'var(--gray)',marginBottom:12}}>This cannot be undone. All scraped stubs and rejection history will be permanently deleted.</p>
          <div style={{display:'flex',gap:8}}>
            <button className="btn-danger" onClick={wipe} disabled={wiping}>
              {wiping?'Wiping…':'Yes, wipe it'}
            </button>
            <button className="btn-secondary" onClick={()=>setShowConfirm(false)} disabled={wiping}>Cancel</button>
          </div>
        </div>}

        {result&&<div style={{marginTop:16,padding:12,background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:8,fontSize:13}}>
          ✅ {result.message}
        </div>}
      </div>
    </div>
  );
};

const App=()=>{
  const [page,setPage]=useState('planner');
  const [hid,setHid]=useState(()=>localStorage.getItem('householdId')||'');
  const [valid,setValid]=useState(false);
  const saveHid=id=>{localStorage.setItem('householdId',id);setHid(id);};
  useEffect(()=>{
    if(!hid){setValid(false);return;}
    get(`/households/${hid}`).then(()=>setValid(true)).catch(()=>{setValid(false);saveHid('');});
  },[hid]);
  if(!hid||!valid)return<ToastProvider><HouseholdGate onSave={saveHid}/></ToastProvider>;
  const pages={planner:<PlannerPage hid={hid}/>,pantry:<PantryPage hid={hid}/>,settings:<SettingsPage hid={hid}/>,sources:<SourcesPage/>,keywords:<KeywordsPage/>,rejections:<RejectionsPage hid={hid}/>,logs:<LogsPage/>,database:<DatabasePage/>};
  return(
    <ToastProvider>
      <Nav page={page} setPage={setPage}/>
      <main className="main">{pages[page]||<div style={{textAlign:'center',padding:60,color:'var(--gray)'}}>🚧 Coming soon</div>}</main>
    </ToastProvider>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
