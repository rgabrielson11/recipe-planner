# Protein category grouping for the suggestion picker.
# order: Lower number appears first. Same order = alphabetical.
# keywords: Matched against recipe title (primary) and ingredient tokens.
# enabled: false merges recipes into Other.

categories:

  - key: chicken
    label: "🍗 Chicken"
    order: 1
    enabled: true
    keywords: [chicken, hen, poultry]

  - key: pork
    label: "🐷 Pork"
    order: 2
    enabled: true
    keywords: [pork, ham, bacon, sausage, chorizo, pancetta, prosciutto, pulled]

  - key: turkey
    label: "🦃 Turkey"
    order: 3
    enabled: true
    keywords: [turkey]

  - key: beef
    label: "🥩 Beef"
    order: 4
    enabled: true
    keywords: [beef, steak, brisket, burger, chuck, ribeye, sirloin, flank, meatball, bolognese, ground]

  - key: pasta
    label: "🍝 Pasta"
    order: 5
    enabled: true
    keywords: [pasta, spaghetti, fettuccine, linguine, penne, rigatoni, tagliatelle, gnocchi, lasagna, lasagne, ravioli, tortellini, orzo, noodle, ramen, udon, lo mein, pad thai]

  - key: fish
    label: "🐟 Fish"
    order: 6
    enabled: true
    keywords: [salmon, tuna, cod, tilapia, halibut, trout, mahi, sea bass, haddock, swordfish, snapper, flounder, catfish, bass, sole, grouper, mackerel, anchovy, sardine]

  - key: shellfish
    label: "🦐 Shellfish"
    order: 7
    enabled: true
    keywords: [shrimp, prawn, crab, lobster, scallop, clam, mussel, squid, calamari, oyster, octopus, crawfish, crayfish]

  - key: vegetarian
    label: "🥦 Vegetarian"
    order: 8
    enabled: true
    keywords: [tofu, tempeh, lentil, chickpea, falafel, portobello, veggie, vegetarian, vegan, cauliflower, eggplant, mushroom]

  - key: other
    label: "🍽️ Other"
    order: 9
    enabled: true
    keywords: [lamb, mutton, duck, venison, bison, rabbit, goat, quail, veal]
