# Protein category grouping for the suggestion picker.
# Recipes are classified by matching keywords against the recipe title
# (primary) and ingredient tokens (fallback).
#
# order:    Lower number appears first in the suggestion list.
#           Two categories with the same order are sorted alphabetically.
# keywords: Words to match against title / ingredient tokens (case-insensitive).
#           The first category whose keywords appear in the title wins.
#           If no title match, the category with the most ingredient hits wins.
# enabled:  Set to false to hide the category header (recipes still show,
#           grouped under "Other").

categories:

  - key: chicken
    label: "🍗 Chicken"
    order: 1
    enabled: true
    keywords: [chicken, hen, poultry]

  - key: pork
    label: "🐷 Pork"
    order: 2
    enabled: true
    keywords: [pork, ham, bacon, sausage, chorizo, pancetta, prosciutto, pulled]

  - key: turkey
    label: "🦃 Turkey"
    order: 3
    enabled: true
    keywords: [turkey]

  - key: beef
    label: "🥩 Beef"
    order: 3
    enabled: true
    keywords: [beef, steak, brisket, burger, chuck, ribeye, sirloin, flank, meatball, bolognese, ground]

  - key: seafood
    label: "🐟 Seafood"
    order: 4
    enabled: true
    keywords: [fish, salmon, tuna, shrimp, prawn, crab, lobster, scallop, cod, tilapia, halibut, trout, mahi, sea bass, clam, mussel, squid, calamari, anchovy, sardine]

  - key: vegetarian
    label: "🥦 Vegetarian"
    order: 5
    enabled: true
    keywords: [tofu, tempeh, lentil, chickpea, falafel, portobello, veggie, vegetarian, vegan, cauliflower, eggplant, mushroom]

  - key: other
    label: "🍽️ Other"
    order: 6
    enabled: true
    keywords: []
