# ─────────────────────────────────────────────────────────────────────────────
# Recipe Discovery Sources — Phase 10 Patch 11
#
# RSS discovery has been removed.  Recipes come from exactly two places:
#   1. HelloFresh  — crawled via their server-rendered A–Z recipe directory
#                    pages (https://www.hellofresh.com/pages/sitemap/recipes-*).
#                    HelloFresh publishes no RSS feed and its XML sitemaps are
#                    bot-gated, but the HTML directory pages are plain link
#                    lists and fetch cleanly.
#   2. Mealie      — your local Mealie library (proven favourites pool),
#                    configured via mealie_min_rating / mealie_favorites_count.
#
# DINNER FILTER
# HelloFresh recipe slugs contain the recipe name.  Candidate URLs whose slug
# matches any non_dinner_title_keywords entry are dropped before scraping.
# Word-boundary matching, case-insensitive.  Edit the list below to tune.
#
# DISCOVERY SETTINGS
#   max_scraped_per_run     Total recipe pages scraped per weekly run.
#                           Budget split: half re-score stubs, half new URLs.
#   request_delay_seconds   Polite pause between requests.
#   user_agent              Sent in every HTTP request.
#   mealie_min_rating       Star threshold for Mealie "proven favourite" pool.
#   mealie_favorites_count  Mealie-favourite slots per weekly suggestion run.
#   min_scraped_rating      Quality gate: min star rating where data exists.
#   min_scraped_reviews     Quality gate: min review count where data exists.
#   stub_rescrape_days      Re-scrape stubs older than this; else use DB cache.
# ─────────────────────────────────────────────────────────────────────────────

discovery:
  max_scraped_per_run: 60
  request_delay_seconds: 1.5
  user_agent: "RecipePlanner/1.0 (personal household meal planner)"
  mealie_min_rating: 4
  mealie_favorites_count: 2
  min_scraped_rating: 4.0
  min_scraped_reviews: 50
  stub_rescrape_days: 7       # re-scrape stubs older than this; score from DB cache if fresher

  # ── Background scrape job (Patch 12) ──────────────────────────────────────
  # A nightly job scrapes new/stale recipes so suggest runs score purely from
  # the DB cache (no network wait).  YAML edits apply within ~5 minutes.
  background_scrape_enabled: true
  background_scrape_hour: 3       # 0-23, server local time
  background_max_scraped: 60      # scrape budget per nightly run

  # ── Non-dinner pre-filter ─────────────────────────────────────────────────
  # Applied to candidate URL slugs (hyphens → spaces) BEFORE scraping.
  # Word-boundary matched, case-insensitive.  Add terms freely.
  # Keep specific ("chocolate chip cookie") rather than broad ("chocolate")
  # to avoid blocking chocolate chicken mole, chocolate chili, etc.
  non_dinner_title_keywords:
    # Dessert categories
  - cupcake
  - brownie
  - cheesecake
  - macaron
  - macaroon
  - tiramisu
  - pavlova
  - panna cotta
  - creme brulee
  - crème brûlée
  - baklava
  - profiterole
  - eclair
  - ice cream
  - gelato
  - sorbet
  - fudge
  - candy bar
  - cookie dough
    # Specific cake types (avoid blocking "chicken cake" or "fishcake")
  - birthday cake
  - layer cake
  - bundt cake
  - coffee cake
  - pound cake
  - vanilla cake
  - carrot cake
  - red velvet cake
  - chocolate cake
  - lemon drizzle cake
    # Muffins / baked sweets
  - muffin
  - muffins
  - cupcake
  - cupcakes
    # Breakfast items
  - pancake
  - pancakes
  - waffle
  - waffles
  - french toast
  - overnight oats
  - acai bowl
  - breakfast burrito        # comment out if you want breakfast-for-dinner
    # Drinks
  - cocktail
  - smoothie
  - milkshake
  - sangria
  - margarita
  - lemonade

