# ─────────────────────────────────────────────────────────────────────────────
# Recipe Discovery Sources — Phase 7c
#
# Sources curated from FeedSpot Top 80 Home Cooking RSS Feeds (June 2026)
# plus existing working sources.  Explicitly excluded:
#   • Pure dessert/baking blogs (Cookies & Cups, Broma Bakery, sourdough)
#   • Breakfast-primary blogs (Heavenly Home Cooking — "breakfast and brunch")
#   • Non-recipe blogs (spice retailers, catering companies)
#   • Very low-activity / Blogspot blogs with no real engagement
#
# DINNER FILTER
# RSS entries are pre-screened against non_dinner_title_keywords before
# scraping.  If the entry title or RSS categories contain any keyword the
# recipe is dropped without using scrape budget.  Edit the list below to
# tune the filter — regex word-boundary matching, case-insensitive.
#
# DISCOVERY SETTINGS
#   max_scraped_per_run     Total recipe pages scraped per weekly run.
#                           Budget split: half re-score stubs, half new URLs.
#   request_delay_seconds   Polite pause between requests.
#   feed_pages              RSS pages to paginate per feed (×10 entries each).
#   user_agent              Sent in every HTTP request.
#   mealie_min_rating       Star threshold for Mealie "proven favourite" pool.
#   mealie_favorites_count  Mealie-favourite slots per weekly suggestion run.
#   min_scraped_rating      Quality gate: min star rating where data exists.
#   min_scraped_reviews     Quality gate: min review count where data exists.
# ─────────────────────────────────────────────────────────────────────────────

discovery:
  max_scraped_per_run: 60       # more sources = more budget needed
  request_delay_seconds: 1.5
  feed_pages: 3                 # 3 pages × 10 entries = up to 30 URLs per feed
  user_agent: "RecipePlanner/1.0 (personal household meal planner; RSS reader)"
  mealie_min_rating: 4
  mealie_favorites_count: 2
  min_scraped_rating: 4.0
  min_scraped_reviews: 50

  # ── Non-dinner pre-filter ─────────────────────────────────────────────────
  # Applied to RSS entry titles and category tags BEFORE scraping.
  # Word-boundary matched, case-insensitive.  Add terms freely.
  # Keep specific ("chocolate chip cookie") rather than broad ("chocolate")
  # to avoid blocking chocolate chicken mole, chocolate chili, etc.
  non_dinner_title_keywords:
    # Dessert categories
    - cupcake
    - brownie
    - cheesecake
    - macaron
    - macaroon
    - tiramisu
    - pavlova
    - panna cotta
    - creme brulee
    - crème brûlée
    - baklava
    - profiterole
    - eclair
    - ice cream
    - gelato
    - sorbet
    - fudge
    - candy bar
    - cookie dough
    # Specific cake types (avoid blocking "chicken cake" or "fishcake")
    - birthday cake
    - layer cake
    - bundt cake
    - coffee cake
    - pound cake
    - vanilla cake
    - carrot cake
    - red velvet cake
    - chocolate cake
    - lemon drizzle cake
    # Muffins / baked sweets
    - muffin
    - muffins
    - cupcake
    - cupcakes
    # Breakfast items
    - pancake
    - pancakes
    - waffle
    - waffles
    - french toast
    - overnight oats
    - acai bowl
    - breakfast burrito      # comment out if you want breakfast-for-dinner
    # Drinks
    - cocktail
    - smoothie
    - milkshake
    - sangria
    - margarita
    - lemonade

