# Pantry staples
#
# These are ingredients assumed to ALWAYS be on hand — salt, pepper, basic
# oils, flour, sugar, etc. They are never added to a generated shopping
# list, and a recipe needing only staples (beyond what's already tracked
# in the pantry_items table) isn't penalized as "missing ingredients" by
# the matching engine.
#
# Edit this file directly (e.g. in VS Code, via the Unraid share/bind
# mount) or manage it through the API: GET/POST/DELETE /pantry/staples.
# Both paths write to this same file, and comments are preserved either
# way.

