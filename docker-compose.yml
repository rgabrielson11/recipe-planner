version: "3.9"

# Single-container deployment — SQLite replaces the separate Postgres service.
# The database file and hand-editable YAML configs are both stored under
# ./data/ on the Unraid host and mounted into the container.
#
# Security: only port 8111 is exposed. No database port, no separate network
# needed (single container). Do NOT forward 8111 through your router —
# this app has no auth layer; it is designed for trusted LAN access only.

services:
  app:
    build: ./backend
    container_name: recipe-planner
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/recipe_planner.db
      MEALIE_BASE_URL: ${MEALIE_BASE_URL:-}
      MEALIE_API_TOKEN: ${MEALIE_API_TOKEN:-}
    ports:
      - "8111:8111"
    volumes:
      # SQLite database file — persists across container restarts/rebuilds
      - ./data/db:/app/data
      # YAML config files — edit directly in VS Code, changes take effect
      # on the next API request with no restart needed
      - ./backend/app/data:/app/app/data
      # Live code reload during development (remove for production)
      - ./backend/app:/app/app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
