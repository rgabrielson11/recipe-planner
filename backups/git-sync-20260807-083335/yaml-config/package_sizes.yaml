# Standard purchasable package sizes per ingredient, used by the shopping
# list generator (Phase 5) to round an aggregated weekly quantity up to a
# real retail unit instead of a fractional amount. Expand this table over
# time as new ingredients show up in scraped recipes — edit directly here,
# no code change needed.

egg:
  unit: count
  package_size: 12
  package_label: dozen

milk:
  unit: fl_oz
  package_size: 64
  package_label: half-gallon

